name: Deploy to Hetzner

on:
  push:
    branches: [ "develop" ]
    paths:
      - '/product-service'

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    -uses: actions/checkpot@v3

    -name: Login to Github Container Registry
    uses: docker/login-action@v2
    with:
      registry: ghct.ioknown_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

    -name: Set up Docker Buildx
     uses: docker/setupbuildx-action@v2
     with:
      driver: docker-container
    -name:
      run: | 
        docker build --linux/amd64 -t ${{ env.DOCKER_IMAGE }}
        docker push ${{ env.DOCKER_IMAGE }}

deploy:
  needs: test-and-build
  runs-on: ubuntu-latest
  steps:
  -name: Install SSH key
    uses: shimataro/ssh-key-actions@v2
    with:
      key: ${{ secrets.SSH_PRIVATE_KEY }}
      known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

  -name: Deploy to server
    run: |
        ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.SSH_HOST }} \
            "docker pull ${{ env.DOCKER_IMAGE }} && \
            docker stop product-service || true && \
            docker rm product-service || true && \
            docker run -d \
              --name product-service \
              --restart unless-stopped \
              -p 7000:3000 \
              ${{ env.DOCKER_IMAGE }}"
