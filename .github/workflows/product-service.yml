name: Deploy to Hetzner

on:
  push:
    branches: [ "develop" ]
    paths:
      - 'product-service/**'
      - '.github/workflows/product-service.yml'

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        run: |
          docker build --platform linux/amd64 -t ${{ env.DOCKER_IMAGE }} ./product-service
          docker push ${{ env.DOCKER_IMAGE }}

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.SSH_HOST }} "
            docker pull ${{ env.DOCKER_IMAGE }} && \
            docker stop product-service || true && \
            docker rm product-service || true && \
            docker run -d \
              --name product-service \
              --restart unless-stopped \
              -p 7000:3000 \
              ${{ env.DOCKER_IMAGE }}"
              
