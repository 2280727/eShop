http:
  port: 8081
admin:
  port: 9876
  host: 135.181.150.234
apiEndpoints:
  api:
    host: 135.181.150.234
    paths: '/categories*'
  health:
    host: '*'
    paths: '/health'
    methods: ['GET']
serviceEndpoints:
  httpbin:
    url: 'http://135.181.150.234:7000/v1/products'
policies:
  - basic-auth
  - cors
  - expression
  - key-auth
  - log
  - oauth2
  - proxy
  - rate-limit
  - request-transformer
pipelines:
  default:
    apiEndpoints:
      - api
    policies:
      - proxy:
          - action:
              serviceEndpoint: httpbin 
              changeOrigin: true
